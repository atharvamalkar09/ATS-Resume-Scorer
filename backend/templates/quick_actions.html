<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Description Match Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 40px 50px;
            line-height: 1.6;
            background: #fff;
        }
 
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 3px solid #1e293b;
            padding-bottom: 14px;
            margin-bottom: 32px;
        }
        .page-header .report-label { 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #64748b; 
        }
        .page-header .date { 
            font-size: 12px; 
            color: #64748b; 
        }
 
        h1.report-title { 
            font-size: 28px; 
            font-weight: 900; 
            color: #0f172a; 
            margin: 0 0 28px 0; 
        }
 
        h2 {
            font-size: 16px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1.5px; 
            color: #334155;
            margin: 32px 0 16px 0; 
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
 
        /* Match Score Cards */
        .match-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
        }
        .match-card {
            flex: 1;
            text-align: center;
            padding: 20px 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .match-card-number { 
            font-size: 42px; 
            font-weight: 900; 
            line-height: 1; 
        }
        .match-card-label { 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px; 
            color: #64748b; 
            margin-top: 6px; 
        }
        .card-keyword { 
            background: #eff6ff; 
        }
        .card-semantic { 
            background: #f5f3ff; 
        }
 
        /* Keyword Pills */
        .pill-section { 
            margin-bottom: 24px; 
        }
        .pill-group-label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 10px;
        }
        .pill-wrap { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
        }
        .pill {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }
        .pill-matched { 
            background: #dcfce7; 
            color: #166534; 
            border: 1px solid #bbf7d0; 
        }
        .pill-missing { 
            background: #fee2e2; 
            color: #991b1b; 
            border: 1px solid #fecaca; 
        }
 
        /* Skills Gap */
        .gap-item {
            padding: 9px 14px;
            border-left: 3px solid #f59e0b;
            background: #fffbeb;
            border-radius: 0 6px 6px 0;
            margin-bottom: 8px;
            font-size: 13px;
            color: #78350f;
        }
 
        /* Suggestions */
        .suggestion {
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #334155;
        }
        .suggestion strong { 
            color: #0f172a; 
        }
 
        /* No JD Message */
        .no-jd-box {
            text-align: center;
            padding: 48px 32px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            color: #64748b;
        }
        .no-jd-icon { 
            font-size: 36px; 
            margin-bottom: 16px; 
        }
        .no-jd-title { 
            font-size: 18px; 
            font-weight: 700; 
            color: #334155; 
            margin-bottom: 8px; 
        }
        .no-jd-tip { 
            font-size: 13px; 
            line-height: 1.7; 
            max-width: 420px; 
            margin: 0 auto; 
        }
 
        .footer {
            margin-top: 48px; 
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 11px; 
            color: #94a3b8;
            display: flex; 
            justify-content: space-between;
        }
    </style>
</head>
<body>
 
    <div class="page-header">
        <div class="report-label">ATS Resume Score Report</div>
        <div class="date" id="report-date"></div>
    </div>
 
    <h1 class="report-title">Job Description Match Analysis</h1>
 
    <div id="report-content"></div>
 
    <div class="footer">
        <span>Generated by ATS Resume Scorer</span>
        <span>Report 3 of 4 — JD Match Analysis</span>
    </div>
 
    <script>
        // Sample data - replace with your actual data
        const reportData = {
            timestamp: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
            keywordMatchPercentage: 78,
            semanticSimilarity: 0.82,
            matchedKeywords: [
                'React',
                'JavaScript',
                'REST API',
                'UI/UX Design',
                'Responsive Design',
                'Frontend Development'
            ],
            missingKeywords: [
                'TypeScript',
                'Redux',
                'GraphQL',
                'Testing',
                'CI/CD'
            ],
            skillsGap: [
                'Docker',
                'Kubernetes',
                'AWS'
            ],
            hasJD: true
        };
 
        // Helper function to determine color based on percentage
        function getScoreColor(percentage) {
            if (percentage >= 70) return '#16a34a';
            if (percentage >= 45) return '#d97706';
            return '#dc2626';
        }
 
        // Generate report HTML
        function generateReport(data) {
            const date = document.getElementById('report-date');
            date.textContent = data.timestamp;
 
            const content = document.getElementById('report-content');
            let html = '';
 
            if (data.hasJD) {
                const kwColor = getScoreColor(data.keywordMatchPercentage);
                const semColor = getScoreColor(data.semanticSimilarity * 100);
 
                // Match Score Cards
                html += `
                    <div class="match-cards">
                        <div class="match-card card-keyword">
                            <div class="match-card-number" style="color: ${kwColor};">
                                ${Math.round(data.keywordMatchPercentage)}%
                            </div>
                            <div class="match-card-label">Keyword Match</div>
                        </div>
                        <div class="match-card card-semantic">
                            <div class="match-card-number" style="color: ${semColor};">
                                ${Math.round(data.semanticSimilarity * 100)}%
                            </div>
                            <div class="match-card-label">Semantic Similarity</div>
                        </div>
                    </div>
                `;
 
                // Matched Keywords
                if (data.matchedKeywords && data.matchedKeywords.length > 0) {
                    html += `
                        <h2>Matched Keywords</h2>
                        <div class="pill-section">
                            <div class="pill-group-label">These keywords from the JD appear in your resume:</div>
                            <div class="pill-wrap">
                                ${data.matchedKeywords.map(kw => `<span class="pill pill-matched">${kw}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }
 
                // Missing Keywords
                if (data.missingKeywords && data.missingKeywords.length > 0) {
                    html += `
                        <h2>Missing Keywords (${data.missingKeywords.length})</h2>
                        <div class="pill-section">
                            <div class="pill-group-label">Important JD keywords NOT found in your resume:</div>
                            <div class="pill-wrap">
                                ${data.missingKeywords.map(kw => `<span class="pill pill-missing">${kw}</span>`).join('')}
                            </div>
                        </div>
                    `;
                }
 
                // Skills Gap
                if (data.skillsGap && data.skillsGap.length > 0) {
                    html += `
                        <h2>Skills Gap (${data.skillsGap.length})</h2>
                        <p style="font-size:13px; color:#64748b; margin-bottom:14px;">
                            The job description mentions these skills that weren't found in your resume.
                            Add them if you have experience with them.
                        </p>
                        ${data.skillsGap.map(skill => `<div class="gap-item">Consider adding: <strong>${skill}</strong></div>`).join('')}
                    `;
                }
 
                // Improvement Suggestions
                html += `<h2>Improvement Suggestions</h2>`;
 
                if (data.keywordMatchPercentage < 40) {
                    html += `
                        <div class="suggestion">
                            <strong>Tailor Your Professional Summary:</strong> Your keyword match is critically low (${Math.round(data.keywordMatchPercentage)}%).
                            Rewrite your Professional Summary to explicitly reference the role title and 2–3 core
                            requirements from the job description.
                        </div>
                    `;
                }
 
                if (data.missingKeywords && data.missingKeywords.length > 0) {
                    html += `
                        <div class="suggestion">
                            <strong>Incorporate Missing Keywords Naturally:</strong>
                            Weave the missing keywords (shown in red above) into your experience bullets or skills section.
                            Do not keyword-stuff — use them in context where you genuinely have experience.
                        </div>
                    `;
                }
 
                if (data.skillsGap && data.skillsGap.length > 0) {
                    html += `
                        <div class="suggestion">
                            <strong>Address the Skills Gap:</strong>
                            The JD mentions ${data.skillsGap.length} skill(s) not found in your resume.
                            If you have these skills, add them to your Skills section and demonstrate them in a project bullet.
                        </div>
                    `;
                }
 
                if (data.keywordMatchPercentage >= 60) {
                    html += `
                        <div class="suggestion">
                            <strong>Quantify Your Matched Keywords:</strong>
                            You have a solid keyword match. Make sure the bullets containing matched keywords
                            also include hard numbers (e.g., "500+ users", "40% faster") to reinforce credibility.
                        </div>
                    `;
                }
 
            } else {
                // No JD Provided
                html += `
                    <div class="no-jd-box">
                        <div class="no-jd-icon">📋</div>
                        <div class="no-jd-title">No Job Description Provided</div>
                        <div class="no-jd-tip">
                            To get a personalised keyword match score, paste or upload the job description
                            in the Analyzer before running your scan.
                            <br><br>
                            This report will show matched/missing keywords, semantic similarity, and
                            tailored improvement suggestions based on the specific role.
                        </div>
                    </div>
                `;
            }
 
            content.innerHTML = html;
        }
 
        // Generate the report on page load
        generateReport(reportData);
    </script>
 
</body>
</html>
